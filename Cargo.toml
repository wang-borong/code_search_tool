[package]
name = "fcs"
version = "0.9.5"
edition = "2021"
rust-version = "1.91"
authors = ["Jason Wang <wang_borong@163.com>"]
homepage = "https://github.com/wang-borong/code_search_tool"
repository = "https://github.com/wang-borong/code_search_tool"
readme = "README.md"
license = "MIT"
description = "Ratatui code tracing workbench using ripgrep-style search, bat previews, LSP, and DAP helpers"
keywords = ["search", "ripgrep", "tui", "lsp", "debugging"]
categories = ["command-line-utilities", "development-tools", "development-tools::debugging"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
regex = "1"
ignore = "0.4"
skim = { git = "https://github.com/wang-borong/skim.git", rev = "403fc3d03ef67d22d4cb20686685c29d51e56c56" }
ratatui = "0.30"
crossterm = "0.29"
thiserror = "2"
bat = "0.26"
grep-searcher = "0.1"
grep-regex = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
memmap2 = "0.9"
