[package]
name = "fcs"
version = "0.6.3"
edition = "2021"
rust-version = "1.91"
authors = ["Jason Wang <wang_borong@163.com>"]
homepage = "https://github.com/wang-borong/code_search_tool"
description = "Fuzzy code search tool using ripgrep, fzf, bat, and neovim as Rust libraries"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
regex = "1"
ignore = "0.4"
skim = { path = "skim" }
ratatui = "0.30"
edit = "0.1"
thiserror = "2"
bat = "0.26"
grep-searcher = "0.1"
grep-regex = "0.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
