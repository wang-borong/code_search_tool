[package]
name = "fcs"
version = "1.3.0"
edition = "2021"
rust-version = "1.91"
authors = ["Jason Wang <wang_borong@163.com>"]
homepage = "https://github.com/wang-borong/code_search_tool"
repository = "https://github.com/wang-borong/code_search_tool"
readme = "README.md"
license = "MIT"
description = "Ratatui code tracing workbench using ripgrep-style search, bat previews, LSP, and DAP helpers"
keywords = ["search", "ripgrep", "tui", "lsp", "debugging"]
categories = ["command-line-utilities", "development-tools", "development-tools::debugging"]

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.6.8"
regex = "1.13.1"
regex-syntax = "0.8.11"
globset = "0.4.19"
ignore = "0.4.31"
skim = { version = "5.6.1", default-features = false }
ratatui = "0.30.2"
crossterm = "0.29.0"
thiserror = "2.0.19"
bat = "0.26.1"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
dirs = "6.0.0"
memmap2 = "0.9.11"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
