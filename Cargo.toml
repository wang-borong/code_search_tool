[package]
name = "fcs"
version = "0.5.0"
edition = "2021"
description = "Fuzzy code search tool using ripgrep, fzf, bat, and neovim as Rust libraries"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
regex = "1"
ignore = "0.4"
skim = { path = "skim" }
ratatui = "0.30"
edit = "0.1"
thiserror = "2"
bat = "0.26"
grep-searcher = "0.1"
grep-regex = "0.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
