[package]
name = "fcs"
version = "0.5.0"
edition = "2021"
description = "Fuzzy code search tool using ripgrep, fzf, bat, and neovim as Rust libraries"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1"
ignore = "0.4"
skim = "4"
edit = "0.1"
thiserror = "2"
bat = "0.26"
grep-searcher = "0.1"
grep-regex = "0.1"
